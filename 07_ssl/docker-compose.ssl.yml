version: "3.8"

services:
  db:
    image: "${MARIADB_IMAGE:-mariadb:10.11.18-jammy}"
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: "${MARIADB_DATABASE:-example}"
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db-password

    secrets:
      - db-password

    volumes:
      - db-data:/var/lib/mysql

    expose:
      - "3306"

    networks:
      - backnet

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: nginx-flask-mysql-backend:1.0

    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    restart: unless-stopped
    init: true

    secrets:
      - db-password

    expose:
      - "8000"

    networks:
      - backnet
      - frontnet

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/", timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    image: "${NGINX_IMAGE:-nginx:1.30.4-alpine}"
    restart: unless-stopped
    init: true

    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certificates/myapp.test.crt:/etc/nginx/certs/myapp.test.crt:ro
      - ./certificates/myapp.test.key:/etc/nginx/certs/myapp.test.key:ro

    networks:
      - frontnet

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-check-certificate -q -O /dev/null https://127.0.0.1/nginx-health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:
    driver: local

secrets:
  db-password:
    file: ./secrets/db_password.txt

networks:
  backnet:
    driver: bridge
    internal: true

  frontnet:
    driver: bridge
